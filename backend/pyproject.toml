[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-engine"
version = "0.1.0"
description = "Multimodal Human Evaluation Engine backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0"
]
